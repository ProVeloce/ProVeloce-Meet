<svg width="72" height="72" viewBox="0 0 72 72" fill="none" xmlns="http://www.w3.org/2000/svg">
<defs>
    <filter id="glow">
      <feGaussianBlur stdDeviation="3" result="coloredBlur"/>
      <feMerge>
        <feMergeNode in="coloredBlur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
    <linearGradient id="shimmer" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#ffffff;stop-opacity:0" />
      <stop offset="50%" style="stop-color:#ffffff;stop-opacity:0.5" />
      <stop offset="100%" style="stop-color:#ffffff;stop-opacity:0" />
      <animate attributeName="x1" values="0%;100%;0%" dur="2s" repeatCount="indefinite"/>
      <animate attributeName="x2" values="100%;200%;100%" dur="2s" repeatCount="indefinite"/>
    </linearGradient>
</defs>
  
  <!-- Outer glow circle with pulsing animation -->
  <circle cx="36" cy="36" r="36" fill="#10B981" fill-opacity="0.15">
    <animate attributeName="r" values="36;40;36" dur="2s" repeatCount="indefinite"/>
    <animate attributeName="fill-opacity" values="0.15;0.25;0.15" dur="2s" repeatCount="indefinite"/>
  </circle>
  
  <!-- Main circle with scale animation -->
  <circle cx="36" cy="36" r="30" fill="#10B981" filter="url(#glow)">
    <animate attributeName="r" values="0;30" dur="0.6s" fill="freeze"/>
    <animateTransform attributeName="transform" type="scale" values="0;1.1;1" dur="0.6s" fill="freeze"/>
    <animate attributeName="opacity" values="0;1" dur="0.3s" fill="freeze"/>
  </circle>
  
  <!-- Checkmark path with drawing animation -->
  <path d="M22 36L30 44L50 24" stroke="white" stroke-width="5" stroke-linecap="round" stroke-linejoin="round" 
        fill="none" stroke-dasharray="35" stroke-dashoffset="35">
    <animate attributeName="stroke-dashoffset" values="35;0" dur="0.8s" begin="0.3s" fill="freeze"/>
    <animate attributeName="opacity" values="0;1" dur="0.1s" begin="0.3s" fill="freeze"/>
    <animateTransform attributeName="transform" type="translate" values="0,0;0,-3;0,0" dur="0.5s" begin="1.1s" fill="freeze"/>
  </path>
  
  <!-- Shimmer effect overlay -->
  <circle cx="36" cy="36" r="30" fill="url(#shimmer)" opacity="0.3">
    <animateTransform attributeName="transform" type="rotate" values="0 36 36;360 36 36" dur="3s" repeatCount="indefinite"/>
  </circle>
</svg>
